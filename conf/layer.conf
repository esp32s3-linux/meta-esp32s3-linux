BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "esp32s3-linux"
BBFILE_PATTERN_esp32s3-linux = "^${LAYERDIR}/"
BBFILE_PRIORITY_esp32s3-linux = "7"

LAYERSERIES_COMPAT_esp32s3-linux = "wrynose"

INHERIT:append = " siteinfo-xtensa"

# This no-MMU external-toolchain BSP does not provide a cross-Canadian SDK.
# Mask only SDK recipes that reject the custom target during global parsing.
BBMASK:append = " meta/recipes-.*/.*-cross-canadian_.*\.bb$ meta/recipes-core/packagegroups/packagegroup-.*cross-canadian.*\.bb$"
